# Commit this file to the project, then run `pre-commit install` once per clone.
# The hook triggers on every commit and scans the full staged index (not only docs).
# pass_filenames must be false: upstream's gitleaks-system does not set it, and without
# it pre-commit appends every staged path while `gitleaks git` accepts at most one arg.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        pass_filenames: false
